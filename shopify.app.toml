# Learn more: https://shopify.dev/docs/api/shopify-cli/configuration
#
# Local dev:  yarn shopify:dev  (CLI tunnel overrides localhost URLs)
# Deploy:     yarn shopify:deploy  (requires SHOPIFY_APP_URL=https://… in .env)

client_id = "ec07942824b8f47726108667643974e8"
name = "Outrage Reviews"
application_url = "https://hsxperts.co"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "read_products,write_products,read_orders,read_customers,write_customers,write_discounts,write_app_proxy"

[auth]
redirect_urls = [
  "https://hsxperts.co/api/auth/callback"
]

[app_proxy]
url = "/api/storefront"
subpath = "outrage-reviews"
prefix = "apps"

[webhooks]
api_version = "2026-01"
