# Learn more: https://shopify.dev/docs/api/shopify-cli/configuration
#
# Local dev:  yarn shopify:dev  (set SHOPIFY_DEV_STORE=store.myshopify.com)
# Deploy:     yarn shopify:deploy  (one deploy; every installed store gets the extension)
# Installs:   each store installs the same app — OAuth is per-shop offline session
#
# hsxperts.co is RETIRED. Production application_url must be the Firebase-hosted
# Outrage Reviews URL on project outrageldn-dashboard (App Hosting / custom domain).
# Locally set SHOPIFY_APP_URL in .env (ngrok HTTPS). automatically_update_urls_on_dev
# rewrites Partners URLs while `yarn shopify:dev` runs.

client_id = "ec07942824b8f47726108667643974e8"
name = "Outrage Reviews"
# Placeholder until Firebase App Hosting URL is live — override via SHOPIFY_APP_URL / shopify app dev.
application_url = "https://outrageldn-dashboard.web.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "read_products,write_products,read_orders,read_customers,write_customers,write_discounts,write_app_proxy"

[auth]
redirect_urls = [
  "https://outrageldn-dashboard.web.app/api/auth/callback"
]

[app_proxy]
url = "/api/storefront"
subpath = "outrage-reviews"
prefix = "apps"

[webhooks]
api_version = "2026-01"
